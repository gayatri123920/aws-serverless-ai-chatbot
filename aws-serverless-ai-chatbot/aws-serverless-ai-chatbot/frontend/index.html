<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AWS AI Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; }
    #chat { border: 1px solid #ccc; height: 420px; overflow-y: auto; padding: 10px; }
    .user { text-align: right; color: #0a7a3d; margin: 8px 0; }
    .bot { text-align: left; color: #123; margin: 8px 0; white-space: pre-wrap; }
    #row { display: flex; gap: 8px; margin-top: 10px; }
    #msg { flex: 1; padding: 8px; }
  </style>
</head>
<body>
  <h2>AWS AI Chatbot</h2>
  <div id="chat"></div>
  <div id="row">
    <input id="msg" placeholder="Type your question..." />
    <button onclick="send()">Send</button>
  </div>

  <script>
    // Replace with your API Gateway invoke URL, ending in /chat
    const API_URL = "https://YOUR-API-ID.execute-api.YOUR-REGION.amazonaws.com/chat";

    // One random id per page load = one conversation
    const sessionId = crypto.randomUUID();
    const chat = document.getElementById("chat");
    const input = document.getElementById("msg");

    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") send();
    });

    function add(cls, text) {
      const d = document.createElement("div");
      d.className = cls;
      d.textContent = text;
      chat.appendChild(d);
      chat.scrollTop = chat.scrollHeight;
      return d;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      add("user", text);
      const wait = add("bot", "Thinking...");
      try {
        const r = await fetch(API_URL, {
          method: "POST",
          // text/plain keeps this a "simple" request, so no CORS preflight is needed.
          // Lambda still parses the body as JSON.
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ sessionId: sessionId, message: text })
        });
        const data = await r.json();
        wait.textContent = data.reply || data.error;
      } catch (e) {
        wait.textContent = "Error: " + e.message;
      }
    }
  </script>
</body>
</html>
